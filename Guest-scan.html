<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupaQ Hotel & Event Centre</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111827;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#1F2937;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* Logo */
.logo{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:50%;
    background:#fff;
    padding:6px;
    margin:0 auto 20px;
    display:block;
}

/* Title */
h1{
    color:#FFD700;
    font-size:34px;
    margin-bottom:10px;
}

.subtitle{
    color:#ddd;
    font-size:18px;
    margin-bottom:30px;
}

/* Buttons */
.button{
    display:block;
    text-decoration:none;
    background:#FFD700;
    color:#000;
    padding:18px;
    margin:15px 0;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.button:hover{
    background:#FFC107;
    transform:translateY(-2px);
}

/* QR Section */
.qr-section{
    margin-top:40px;
    border-top:1px solid rgba(255,255,255,.15);
    padding-top:30px;
}

.qrcode{
    width:230px;
    max-width:100%;
    background:#fff;
    padding:10px;
    border-radius:12px;
    display:block;
    margin:auto;
}

.scan-text{
    color:#FFD700;
    margin-top:18px;
    font-size:18px;
    font-weight:bold;
}

footer{
    margin-top:30px;
    color:#bbb;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<img src="supaqlogo.jpg" alt="SupaQ Hotel Logo" class="logo">

<h1>SupaQ Hotel & Event Centre</h1>

<p class="subtitle">
Welcome! Please choose a service below.
</p>

<a href="Menu.html" class="button">
🍽 Restaurant Menu
</a>

<a href="Rooms.html" class="button">
🛏 Room Categories & Prices
</a>

<a href="services.html" class="button">
🛎 Guest Services
</a>

<a href="contact.html" class="button">
📞 Contact Us
</a>

<a href="location.html" class="button">
📍 Hotel Location
</a>

<div class="qr-section">

<a href="https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html" target="_blank">
<img src="qrcode2.jpg" alt="Restaurant QR Code" class="qrcode">
</a>

<p class="scan-text">
📱 Scan the QR Code to View Our Digital Menu
</p>

</div>

<footer>
© 2026 SupaQ Hotel & Event Centre<br>
All Rights Reserved.
</footer>

</div>

</body>
</html>
