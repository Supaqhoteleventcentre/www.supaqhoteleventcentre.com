<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupaQ Hotel & Event Centre</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:500px;
background:#1f2937;
padding:30px;
border-radius:15px;
text-align:center;
}

h1{
color:#FFD700;
margin-bottom:10px;
}

p{
margin-bottom:20px;
}

#qrcode{
display:flex;
justify-content:center;
margin:20px 0;
}

a{
display:block;
text-decoration:none;
background:#FFD700;
color:#000;
padding:15px;
margin:12px 0;
border-radius:8px;
font-weight:bold;
}

footer{
margin-top:20px;
font-size:14px;
color:#ccc;
}
</style>
</head>

<body>

<div class="container">

<h1>SupaQ Hotel & Event Centre</h1>

<p>Scan the QR code below to open the Guest Scan page.</p>

<div id="qrcode"></div>

<a href="https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html">
Open Guest Scan
</a>

<footer>
© 2026 SupaQ Hotel & Event Centre
</footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
new QRCode(document.getElementById("qrcode"), {
text: "https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html",
width: 220,
height: 220
});
</script>

</body>
</html>
