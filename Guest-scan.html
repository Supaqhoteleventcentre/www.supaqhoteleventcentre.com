<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupaQ Hotel & Event Centre</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    width:350px;
}

h1{
    color:#b8860b;
    margin-bottom:10px;
}

p{
    margin-bottom:20px;
}

img{
    width:250px;
    height:250px;
    border:5px solid #b8860b;
    border-radius:10px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    background:#b8860b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#8b6508;
}
</style>
</head>

<body>

<div class="container">

<h1>SupaQ Hotel & Event Centre</h1>

<p>Scan the QR Code below to visit our Guest Scan page.</p>

<a href="https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html">
<img src="your-qr-code.png" alt="QR Code">
</a>

<br>

<button onclick="window.location.href='https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html'">
Visit Website
</button>

</div>

</body>
</html>
