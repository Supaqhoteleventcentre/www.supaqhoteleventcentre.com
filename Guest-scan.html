<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SupaQ Hotel - Guest Services</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    padding:45px 20px;
}

h1{
    color:#d4af37;
    font-size:30px;
    margin-bottom:10px;
}

.welcome{
    color:#ddd;
    font-size:17px;
    line-height:1.6;
    margin-bottom:30px;
}

.btn{
    display:block;
    width:100%;
    max-width:360px;
    margin:15px auto;
    padding:18px;
    background:#d4af37;
    color:#111;
    text-decoration:none;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#c8a631;
    transform:scale(1.02);
}

.qr-section{
    margin-top:45px;
    border-top:1px solid #333;
    padding-top:30px;
}

.qr-section h2{
    color:#d4af37;
}

.qr-section p{
    color:#ccc;
}

.qr-code{
    width:220px;
    height:220px;
    max-width:100%;
    background:#fff;
    padding:10px;
    border-radius:10px;
}

.scan-note{
    margin-top:15px;
    color:#999;
}

footer{
    margin-top:40px;
    color:#777;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<h1>SupaQ Hotel & Event Centre</h1>

<p class="welcome">
Welcome! Please choose a service below.
</p>

<a href="Menu.html" class="btn">🍽️ View Menu</a>

<a href="Rooms.html" class="btn">🛏️ View Rooms</a>

<a href="contact.html" class="btn">📞 Contact Us</a>

<a href="location.html" class="btn">📍 Our Location</a>

<a href="services.html" class="btn">🛎️ Guest Services</a>

<div class="qr-section">

<h2>Scan to View Our Rooms</h2>

<p>Scan this QR code to go directly to the Rooms & Prices page.</p>

<img class="qr-code"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://supaqhoteleventcentrecom.vercel.app/Rooms.html"
alt="QR Code">

<p class="scan-note">
Scan with your phone camera
</p>

</div>

<footer>
© 2026 SupaQ Hotel & Event Centre
</footer>

</div>

</body>
</html>
