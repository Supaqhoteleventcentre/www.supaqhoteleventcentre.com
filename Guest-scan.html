<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupaQ Hotel & Event Centre</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111827;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    margin-bottom:15px;
}

h1{
    color:#FFD700;
    margin-bottom:10px;
}

p{
    color:#ddd;
    margin-bottom:20px;
}

.qrcode{
    width:230px;
    max-width:100%;
    background:#fff;
    padding:10px;
    border-radius:10px;
    margin:20px auto;
    display:block;
}

.scan-text{
    margin-top:10px;
    margin-bottom:20px;
    color:#FFD700;
    font-weight:bold;
}

.button{
    display:block;
    text-decoration:none;
    background:#FFD700;
    color:#000;
    padding:15px;
    margin:12px 0;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.button:hover{
    background:#ffcc00;
}

footer{
    margin-top:25px;
    color:#bbb;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>SupaQ Hotel & Event Centre</h1>

<p>Welcome. Scan the QR code or choose a service below.</p>

<a href="https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html" target="_blank">
    <img src="qrcode2.jpg" class="qrcode" alt="QR Code">
</a>

<div class="scan-text">
Scan QR Code to Access Our Digital Menu
</div>

<a href="Menu.html" class="button">
🍽 Restaurant Menu
</a>

<a href="Rooms.html" class="button">
🛏 Room Categories & Prices
</a>

<a href="services.html" class="button">
🛎 Guest Services
</a>

<a href="contact.html" class="button">
📞 Contact Us
</a>

<a href="location.html" class="button">
📍 Hotel Location
</a>

<footer>
&copy; 2026 SupaQ Hotel & Event Centre. All Rights Reserved.
</footer>

</div>

</body>
</html>
