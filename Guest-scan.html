<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupaQ Hotel & Event Centre</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111827;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#1F2937;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    padding:8px;
    margin:0 auto 20px;
    display:block;
}

h1{
    color:#FFD700;
    margin-bottom:10px;
    font-size:30px;
}

.subtitle{
    color:#ddd;
    margin-bottom:25px;
    font-size:17px;
}

.button{
    display:block;
    background:#FFD700;
    color:#000;
    text-decoration:none;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    transition:0.3s;
}

.button:hover{
    background:#FFC107;
}

.qr-section{
    margin-top:35px;
}

.qrcode{
    width:220px;
    max-width:100%;
    background:#fff;
    padding:10px;
    border-radius:10px;
    display:block;
    margin:0 auto;
}

.scan-text{
    margin-top:15px;
    color:#FFD700;
    font-size:18px;
    font-weight:bold;
}

footer{
    margin-top:25px;
    color:#bbb;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<!-- Hotel Logo -->
<img src="supaq logo.jpg" alt="SupaQ Hotel Logo" class="logo">

<h1>SupaQ Hotel & Event Centre</h1>

<p class="subtitle">
Welcome! Please choose a service below.
</p>

<a href="Menu.html" class="button">
🍽 Restaurant Menu
</a>

<a href="Rooms.html" class="button">
🛏 Room Categories & Prices
</a>

<a href="services.html" class="button">
🛎 Guest Services
</a>

<a href="contact.html" class="button">
📞 Contact Us
</a>

<a href="location.html" class="button">
📍 Hotel Location
</a>

<div class="qr-section">

<a href="https://supaqhoteleventcentrecom.vercel.app/Guest-scan.html" target="_blank">
<img src="qrcode2.jpg" alt="QR Code" class="qrcode">
</a>

<p class="scan-text">
📱 Scan the QR Code to Access Our Digital Menu
</p>

</div>

<footer>
&copy; 2026 SupaQ Hotel & Event Centre<br>
All Rights Reserved.
</footer>

</div>

</body>
</html>
